      const root = document.getElementById('golomt-trade-concept');

      const secondaryTitle = root.querySelector('[data-secondary-title]');
      const viewTitles = { home: 'Home', watchlist: 'Watchlists', holdings: 'Holdings', reports: 'Reporting' };
      function setPrimaryView(view) {
        shell.dataset.activeView = view;
        root.querySelectorAll('.gc-nav [data-primary-view]').forEach(button =&gt; {
          if (button.dataset.primaryView === view) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        secondaryTitle.textContent = viewTitles[view] || '';
      }
      root.querySelectorAll('[data-primary-view]').forEach(button =&gt; button.addEventListener('click', () =&gt; setPrimaryView(button.dataset.primaryView)));

      const homeSeries = [
        { x: 22, y: 182, value: 'MNT 251,420,000', date: '24 Jul 2026' },
        { x: 98, y: 166, value: 'MNT 255,100,000', date: '28 Jul 2026' },
        { x: 174, y: 149, value: 'MNT 258,900,000', date: '01 Aug 2026' },
        { x: 250, y: 157, value: 'MNT 257,140,000', date: '05 Aug 2026' },
        { x: 326, y: 129, value: 'MNT 263,420,000', date: '09 Aug 2026' },
        { x: 402, y: 99, value: 'MNT 270,220,000', date: '13 Aug 2026' },
        { x: 478, y: 76, value: 'MNT 275,360,000', date: '17 Aug 2026' },
        { x: 554, y: 92, value: 'MNT 271,740,000', date: '21 Aug 2026' },
        { x: 630, y: 47, value: 'MNT 284,560,410', date: '25 Aug 2026' }
      ];
      const homeCanvas = root.querySelector('[data-home-chart-canvas]');
      const homeHit = root.querySelector('[data-home-chart-hit]');
      const homeTooltip = root.querySelector('[data-home-tooltip]');
      const homeGuide = root.querySelector('[data-home-guide]');
      const homeGuideDot = root.querySelector('[data-home-guide-dot]');
      function showHomePoint(event) {
        const bounds = homeCanvas.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
        const point = homeSeries[Math.round(ratio * (homeSeries.length - 1))];
        homeTooltip.querySelector('b').textContent = point.value;
        homeTooltip.querySelector('span').textContent = `${point.date} · portfolio value`;
        const left = Math.max(6, Math.min(bounds.width - 152, (point.x / 660) * bounds.width + 8));
        homeTooltip.style.left = `${left}px`;
        homeTooltip.style.right = 'auto';
        homeTooltip.style.opacity = '1';
        homeGuide.setAttribute('x1', point.x); homeGuide.setAttribute('x2', point.x);
        homeGuideDot.setAttribute('cx', point.x); homeGuideDot.setAttribute('cy', point.y);
      }
      homeHit.addEventListener('pointermove', showHomePoint);
      homeHit.addEventListener('pointerleave', () =&gt; { homeTooltip.style.opacity = '0'; });

      const watchlistMenu = root.querySelector('[data-watchlist-menu]');
      const watchlistTitle = root.querySelector('[data-watchlist-title]');
      const watchlistCount = root.querySelector('[data-watchlist-count]');
      const watchlistBody = root.querySelector('[data-watchlist-body]');
      let newWatchlistNumber = 1;
      let extraInstrumentNumber = 0;
      function updateWatchlistCount() {
        const count = watchlistBody.querySelectorAll('tr').length;
        watchlistCount.textContent = count;
        const selectedCount = watchlistMenu.querySelector('.is-active span');
        if (selectedCount) selectedCount.textContent = count;
      }
      function selectWatchlist(button) {
        watchlistMenu.querySelectorAll('[data-watchlist-name]').forEach(item =&gt; item.classList.toggle('is-active', item === button));
        watchlistTitle.textContent = button.dataset.watchlistName;
        updateWatchlistCount();
      }
      watchlistMenu.addEventListener('click', event =&gt; {
        const button = event.target.closest('[data-watchlist-name]');
        if (button) selectWatchlist(button);
      });
      root.querySelectorAll('[data-create-watchlist]').forEach(button =&gt; button.addEventListener('click', () =&gt; {
        const name = `New watchlist ${newWatchlistNumber++}`;
        const item = document.createElement('button');
        item.type = 'button'; item.className = 'gc-watch-menu-item'; item.dataset.watchlistName = name;
        item.innerHTML = `${name} &lt;span&gt;0&lt;/span&gt;`;
        watchlistMenu.appendChild(item); selectWatchlist(item);

(() =&gt; {

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

  let skipDelayUntil = 0;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
