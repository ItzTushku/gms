:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

) {

}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

#widget &gt; svg {

svg.lucide {

  flex: none;
  margin: 0 !important;

}

.text-warning,
.text-destructive {

}

    function stockPriceNumber(value) {
      return Number(String(value).replace(/,/g, &quot;&quot;));
    }

    function formatStockQuote(value) {
      return Number(value).toLocaleString(&quot;en-US&quot;, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderStockDepth(stock) {
      const price = stockPriceNumber(stock.price);
      const step = Math.max(price * 0.003, price &gt;= 1000 ? 1 : 0.1);
      const levels = [
        [price - step, 800, price + step, 1200],
        [price - step * 2, 600, price + step * 2, 950],
        [price - step * 3, 500, price + step * 3, 2100]
      ];
      levels.forEach((level, index) =&gt; {
        stockDepthValues[index * 2].textContent = formatStockQuote(level[0]) + &quot; · &quot; + level[1].toLocaleString(&quot;en-US&quot;);
        stockDepthValues[index * 2 + 1].textContent = formatStockQuote(level[2]) + &quot; · &quot; + level[3].toLocaleString(&quot;en-US&quot;);
      });
    }

    function syncStockOrderFields() {
      const isMarket = stockOrderType.value === &quot;Market&quot;;
      stockLimitPrice.disabled = isMarket;
      stockLimitPriceLabel.textContent = isMarket ? &quot;Reference price&quot; : &quot;Limit price&quot;;
      if (isMarket &amp;&amp; selectedStock) {
        stockLimitPrice.value = selectedStock.price;
      }
    }

    function previewStockOrder() {
      if (!selectedStock) {
        status.textContent = &quot;Select an MSE listed stock before previewing an order.&quot;;
        return;
      }
      const quantity = Math.floor(Number(stockQuantity.value.replace(/,/g, &quot;&quot;)));
      const isMarket = stockOrderType.value === &quot;Market&quot;;
      const price = isMarket ? stockPriceNumber(selectedStock.price) : stockPriceNumber(stockLimitPrice.value);
      if (!Number.isFinite(quantity) || quantity &lt;= 0) {
        status.textContent = &quot;Enter a valid whole-share quantity before previewing the order.&quot;;
        stockQuantity.focus();
        return;
      }
      if (!Number.isFinite(price) || price &lt;= 0) {
        status.textContent = &quot;Enter a valid price before previewing the order.&quot;;
        stockLimitPrice.focus();
        return;
      }
      const value = quantity * price;
      const projectedCash = 18405000 + (stockOrderAction === &quot;Buy&quot; ? -value : value);
      stockOrderPreviewData = {
        symbol: selectedStock.symbol,
        name: selectedStock.name,
        action: stockOrderAction,
        quantity: quantity,
        price: formatStockQuote(price),
        type: stockOrderType.value,
        timeInForce: stockTimeInForce.value,
        value: value,
        isMarket: isMarket
      };
      stockPreviewAction.textContent = stockOrderAction;
      stockPreviewInstrument.textContent = selectedStock.symbol + &quot; · MSE&quot;;
      stockPreviewQuantity.textContent = formatMnt(quantity) + &quot; shares&quot;;
      stockPreviewType.textContent = stockOrderType.value + &quot; · &quot; + stockTimeInForce.value;
      stockPreviewPriceLabel.textContent = isMarket ? &quot;Reference price&quot; : &quot;Limit price&quot;;
      stockPreviewPrice.textContent = &quot;MNT &quot; + formatStockQuote(price);
      stockPreviewValue.textContent = &quot;MNT &quot; + formatMnt(value);
      stockPreviewCash.textContent = &quot;MNT &quot; + formatMnt(projectedCash);
      stockPreviewNote.textContent = isMarket ? &quot;A market order will be transmitted at the best available price. The displayed reference and cash impact are indicative and may change at execution.&quot; : &quot;A limit order will be transmitted to the MSE and remain working until it can be matched. Displayed value excludes fees and is indicative only.&quot;;
      stockOrderPreviewPanel.hidden = false;

    function renderStockChart(timeframe) {
      const activeStock = selectedStock || stockUniverse[0];
      const referencePrice = stockPriceNumber(activeStock.price);
      const scale = referencePrice / 1037;
      const candles = (apuTimeframeSeries[timeframe] || apuTimeframeSeries[&quot;1D&quot;]).map((candle) =&gt; candle.map((value) =&gt; Math.round(value * scale * 100) / 100));
      const allPrices = candles.flat();
      const rawMin = Math.min(...allPrices);
      const rawMax = Math.max(...allPrices);
      const padding = Math.max((rawMax - rawMin) * 0.12, referencePrice * 0.018);
      const minPrice = rawMin - padding;
      const maxPrice = rawMax + padding;
      const left = 12;
      const right = 654;
      const top = 12;
      const bottom = 168;
      const plotHeight = bottom - top;
      const plotWidth = right - left;
      const yForPrice = (value) =&gt; bottom - ((value - minPrice) / (maxPrice - minPrice)) * plotHeight;
      const xForIndex = (index) =&gt; left + ((index + 0.5) / candles.length) * plotWidth;
      const svgElement = (name, attributes, textContent) =&gt; {
        const element = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, name);
        Object.entries(attributes || {}).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
        if (textContent) {
          element.textContent = textContent;
        }
        return element;
      };
      while (stockLiveChart.firstChild) {
        stockLiveChart.removeChild(stockLiveChart.firstChild);
      }
      for (let index = 0; index &lt;= 4; index += 1) {
        const y = top + (plotHeight / 4) * index;
        const gridValue = maxPrice - ((maxPrice - minPrice) / 4) * index;
        stockLiveChart.append(svgElement(&quot;line&quot;, { x1: left, y1: y, x2: right, y2: y, stroke: &quot;#dfe7ed&quot;, &quot;stroke-width&quot;: 1 }));
        stockLiveChart.append(svgElement(&quot;text&quot;, { x: 664, y: y + 3 }, formatMnt(gridValue)));
      }
      const candleWidth = Math.max(10, Math.min(22, (plotWidth / candles.length) * 0.42));
      candles.forEach((candle, index) =&gt; {
        const [open, high, low, close] = candle;
        const x = xForIndex(index);
        const color = close &gt;= open ? &quot;#0a9a79&quot; : &quot;#c45558&quot;;
        const bodyTop = Math.min(yForPrice(open), yForPrice(close));
        const bodyHeight = Math.max(2, Math.abs(yForPrice(open) - yForPrice(close)));
        stockLiveChart.append(svgElement(&quot;line&quot;, { x1: x, y1: yForPrice(high), x2: x, y2: yForPrice(low), stroke: color, &quot;stroke-width&quot;: 2 }));
        stockLiveChart.append(svgElement(&quot;rect&quot;, { x: x - candleWidth / 2, y: bodyTop, width: candleWidth, height: bodyHeight, fill: color, rx: 1 }));
      });
      const lastCandle = candles[candles.length - 1];
      const lastClose = lastCandle[3];
      const closeY = yForPrice(lastClose);
      stockLiveChart.append(svgElement(&quot;line&quot;, { x1: left, y1: closeY, x2: right, y2: closeY, stroke: &quot;#0f886f&quot;, &quot;stroke-width&quot;: 1.5, &quot;stroke-dasharray&quot;: &quot;4 4&quot; }));
      stockLiveChart.append(svgElement(&quot;rect&quot;, { x: 657, y: closeY - 10, width: 58, height: 19, fill: &quot;#0f886f&quot;, rx: 2 }));
      stockLiveChart.append(svgElement(&quot;text&quot;, { x: 661, y: closeY + 3, fill: &quot;#ffffff&quot;, style: &quot;font-weight:600&quot; }, formatMnt(lastClose)));
      const labels = stockTimeframeLabels[timeframe] || stockTimeframeLabels[&quot;1D&quot;];
      labels.forEach((label, index) =&gt; {
        const x = left + (plotWidth / Math.max(1, labels.length - 1)) * index;
        stockLiveChart.append(svgElement(&quot;text&quot;, { x: x, y: 204, &quot;text-anchor&quot;: index === 0 ? &quot;start&quot; : index === labels.length - 1 ? &quot;end&quot; : &quot;middle&quot; }, label));
      });
      stockChartTitle.textContent = activeStock.symbol + &quot; price chart&quot;;
      stockChartMeta.textContent = activeStock.symbol + &quot; · &quot; + timeframe + &quot; · MSE&quot;;
      stockChartOhlc.textContent = &quot; · O &quot; + lastCandle[0].toFixed(2) + &quot; · H &quot; + lastCandle[1].toFixed(2) + &quot; · L &quot; + lastCandle[2].toFixed(2) + &quot; · C &quot; + lastCandle[3].toFixed(2);
      stockDataNote.textContent = activeStock.symbol === &quot;APU&quot; ? &quot;MSE reference 1,037 MNT · &quot; + timeframe : &quot;Illustrative MSE view · &quot; + timeframe;
      stockLiveChart.setAttribute(&quot;aria-label&quot;, activeStock.symbol + &quot; &quot; + timeframe + &quot; candlestick view aligned to the displayed MSE reference price&quot;);
    }

      const accountValue = Math.round((baseValue / accountProfiles.all.homeTotal) * profile.homeTotal);
      const x = 12 + (index * 78);
      const chartBounds = homeChartHit.getBoundingClientRect();
      const chartWidth = chartBounds.width || 636;

      const tooltipLeft = Math.max(72, Math.min(chartWidth - 72, displayX));
      homeValue.textContent = &quot;MNT &quot; + formatMnt(accountValue);
      homeChange.textContent = profile.homeChange.replace(&quot; over one month&quot;, &quot; · 1M&quot;);

      homeChartDot.setAttribute(&quot;cx&quot;, String(x));
      homeChartDot.setAttribute(&quot;cy&quot;, String(item.y));

    function renderWatchlist(message) {

    function filterHoldings() {
      const location = holdingsAccount.value;

        const pendingStockMatches = row.dataset.pendingStock !== &quot;true&quot; || pendingStockOrder !== null;
        const visible = pendingStockMatches &amp;&amp; locationMatches &amp;&amp; accountMatches;
        row.hidden = !visible;
        if (visible) {

      holdingsFeedback.textContent = &quot;Showing &quot; + count + &quot; assets for &quot; + accountLabel + &quot; in &quot; + locationLabel + &quot;.&quot;;

    function renderPendingOrder() {
      while (pendingOrders.firstChild) {
        pendingOrders.removeChild(pendingOrders.firstChild);
      }
      if (!pendingStockOrder) {
        const emptyRow = document.createElement(&quot;tr&quot;);
        const emptyCell = document.createElement(&quot;td&quot;);

        emptyCell.textContent = &quot;No new stock activity. Preview and transmit a Stock order to list it here.&quot;;
        emptyRow.append(emptyCell);
        pendingOrders.append(emptyRow);
        pendingOrderCount.textContent = &quot;No new stock orders&quot;;
        stockHolding.hidden = true;
        return;
      }
      const order = pendingStockOrder;
      const isExecuted = order.status === &quot;Executed&quot;;
      const direction = order.action === &quot;Buy&quot; ? &quot;+&quot; : &quot;−&quot;;
      const positionState = isExecuted ? &quot; settled&quot; : &quot; projected&quot;;
      const projected = direction + formatMnt(order.quantity) + positionState;
      stockHoldingSymbol.textContent = order.symbol;
      stockHoldingName.textContent = order.name + (isExecuted ? &quot; · MSE executed instruction&quot; : &quot; · MSE working instruction&quot;);
      stockHoldingQuantity.textContent = projected;
      stockHoldingPrice.textContent = &quot;MNT &quot; + order.price;
      stockHoldingValue.textContent = &quot;MNT &quot; + formatMnt(order.value);
      stockHoldingStatus.textContent = (isExecuted ? &quot;Executed &quot; : &quot;Working &quot;) + order.action.toLowerCase();
      stockHoldingStatus.classList.toggle(&quot;gctw-pending&quot;, !isExecuted);
      stockHolding.hidden = false;
      const row = document.createElement(&quot;tr&quot;);
      appendPendingOrderCell(row, order.symbol, order.name + &quot; · MSE&quot;);
      appendPendingOrderCell(row, order.action, order.action === &quot;Buy&quot; ? &quot;Increase &quot; + (isExecuted ? &quot;settled&quot; : &quot;projected&quot;) + &quot; holding&quot; : &quot;Reduce &quot; + (isExecuted ? &quot;settled&quot; : &quot;projected&quot;) + &quot; holding&quot;, order.action === &quot;Buy&quot; ? &quot;gctw-up&quot; : &quot;gctw-down&quot;);
      appendPendingOrderCell(row, order.type, order.timeInForce + &quot; · Stock order&quot;);
      appendPendingOrderCell(row, formatMnt(order.quantity), &quot;shares&quot;);
      appendPendingOrderCell(row, &quot;MNT &quot; + order.price, order.isMarket ? &quot;Reference quote&quot; : &quot;Limit price&quot;);
      appendPendingOrderCell(row, &quot;MNT &quot; + formatMnt(order.value), &quot;Before fees&quot;);
      const statusCell = document.createElement(&quot;td&quot;);
      const statusBadge = document.createElement(&quot;span&quot;);
      statusBadge.className = isExecuted ? &quot;gctw-availability&quot; : &quot;gctw-availability gctw-pending&quot;;
      statusBadge.textContent = order.status;
      statusCell.append(statusBadge);
      row.append(statusCell);
      pendingOrders.append(row);
      pendingOrderCount.textContent = isExecuted ? &quot;1 stock order executed&quot; : &quot;1 stock order working&quot;;
      filterHoldings();
      holdingsFeedback.textContent = order.action + &quot; &quot; + formatMnt(order.quantity) + &quot; &quot; + order.symbol + (isExecuted ? &quot; is executed and reflected in holdings.&quot; : &quot; is working and shown as a projected holding.&quot;);
    }

    primaryButtons.forEach((button) =&gt; {

    commodityProducts.forEach((product) =&gt; {

        commodityProducts.forEach((item) =&gt; {
          const selected = item === product;
          item.classList.toggle(&quot;is-selected&quot;, selected);
          item.setAttribute(&quot;aria-pressed&quot;, String(selected));
        });
        status.textContent = product.querySelector(&quot;strong&quot;).textContent + &quot; selected in the commodities workspace.&quot;;
      });
    });
    stockSearchInput.addEventListener(&quot;input&quot;, () =&gt; {
      const typed = stockSearchInput.value.trim().toUpperCase();
      if (typed !== selectedStockSymbol) {
        selectedStockSymbol = &quot;&quot;;
        selectedStock = null;
        stockSelected.hidden = true;
        stockEmpty.hidden = false;
        stockDetails.hidden = true;
      }
      renderStockSearchResults(stockSearchInput.value);
    });
    stockTimeframeButtons.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        selectedStockTimeframe = button.dataset.stockTimeframe;
        stockTimeframeButtons.forEach((item) =&gt; {
          const isSelected = item === button;
          item.classList.toggle(&quot;gctw-chart-on&quot;, isSelected);
          item.setAttribute(&quot;aria-pressed&quot;, String(isSelected));
        });
        renderStockChart(selectedStockTimeframe);
        status.textContent = (selectedStock ? selectedStock.symbol : &quot;APU&quot;) + &quot; chart timeframe changed to &quot; + selectedStockTimeframe + &quot;.&quot;;
      });
    });
    stockActionButtons.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        stockOrderAction = button.textContent.trim();
        stockActionButtons.forEach((item) =&gt; {
          const isSelected = item === button;
          item.classList.toggle(&quot;gctw-buy&quot;, isSelected &amp;&amp; stockOrderAction === &quot;Buy&quot;);
          item.classList.toggle(&quot;gctw-sell&quot;, isSelected &amp;&amp; stockOrderAction === &quot;Sell&quot;);
          item.setAttribute(&quot;aria-pressed&quot;, String(isSelected));
        });
        status.textContent = stockOrderAction + &quot; selected for the stock order ticket.&quot;;
      });
    });
    stockOrderType.addEventListener(&quot;change&quot;, syncStockOrderFields);
    stockReview.addEventListener(&quot;click&quot;, previewStockOrder);
    stockPreviewCancel.addEventListener(&quot;click&quot;, () =&gt; {
      stockOrderPreviewPanel.hidden = true;
      stockOrderPreviewData = null;
      status.textContent = &quot;Order preview closed. No instruction was transmitted.&quot;;
      stockReview.focus();
    });
    stockOrderPreviewPanel.addEventListener(&quot;click&quot;, (event) =&gt; {
      if (event.target === stockOrderPreviewPanel) {
        stockOrderPreviewPanel.hidden = true;
        stockOrderPreviewData = null;
        status.textContent = &quot;Order preview closed. No instruction was transmitted.&quot;;
      }
    });
    stockOrderTransmit.addEventListener(&quot;click&quot;, () =&gt; {
      if (!stockOrderPreviewData) {
        stockOrderPreviewPanel.hidden = true;
        return;
      }
      const preview = stockOrderPreviewData;
      pendingStockOrder = {
        ...preview,
        status: preview.isMarket ? &quot;Executed&quot; : &quot;Working&quot;
      };
      stockOrderPreviewPanel.hidden = true;
      stockOrderPreviewData = null;
      renderPendingOrder();
      stockReview.textContent = &quot;Preview another stock order&quot;;
      showOrderSuccess(preview.type === &quot;Market&quot; ? preview.action + &quot; &quot; + formatMnt(preview.quantity) + &quot; &quot; + preview.symbol + &quot; was transmitted and executed at the indicative reference price.&quot; : preview.action + &quot; &quot; + formatMnt(preview.quantity) + &quot; &quot; + preview.symbol + &quot; was transmitted to MSE and is now working.&quot;);
      status.textContent = preview.type === &quot;Market&quot; ? preview.action + &quot; &quot; + formatMnt(preview.quantity) + &quot; &quot; + preview.symbol + &quot; transmitted and executed at the indicative reference price.&quot; : preview.action + &quot; &quot; + formatMnt(preview.quantity) + &quot; &quot; + preview.symbol + &quot; transmitted to MSE and is now working.&quot;;
    });
    orderSuccessDismiss.addEventListener(&quot;click&quot;, () =&gt; {
      if (orderSuccessTimeout) {
        clearTimeout(orderSuccessTimeout);
      }
      orderSuccess.hidden = true;
    });
    bondsTrigger.addEventListener(&quot;click&quot;, () =&gt; {
      const isBond = selectedView === &quot;bond-listed&quot; || selectedView === &quot;bond-rfq&quot;;
      if (!isBond) {
        selectView(&quot;bond-listed&quot;);
        return;
      }
      bondOptions.hidden = !bondOptions.hidden;
      bondsTrigger.setAttribute(&quot;aria-expanded&quot;, String(!bondOptions.hidden));
    });
    root.querySelectorAll(&quot;[data-go-trade]&quot;).forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; selectPrimary(&quot;trade&quot;));
    });
    homeChartHit.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
      const bounds = homeChartHit.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
      updateHomeChart(Math.round(ratio * (homeValues.length - 1)), event.clientX - bounds.left);
    });
    homeChartHit.addEventListener(&quot;pointerleave&quot;, () =&gt; updateHomeChart(homeValues.length - 1));
    watchTabs.addEventListener(&quot;click&quot;, (event) =&gt; {
      const button = event.target.closest(&quot;[data-watchlist-id]&quot;);
      if (!button) {
        return;
      }
      selectedWatchlist = button.dataset.watchlistId;
      renderWatchlist(&quot;Showing &quot; + watchlists[selectedWatchlist].name + &quot;.&quot;);
    });
    createWatchlist.addEventListener(&quot;click&quot;, () =&gt; {
      watchlistSequence += 1;
      const id = &quot;custom-&quot; + watchlistSequence;
      watchlists[id] = { name: &quot;New watchlist &quot; + watchlistSequence, instruments: [] };
      selectedWatchlist = id;
      renderWatchlist(&quot;New watchlist created. Add instruments to populate it.&quot;);
    });
    deleteWatchlist.addEventListener(&quot;click&quot;, () =&gt; {
      const ids = Object.keys(watchlists);
      if (ids.length === 1) {
        watchFeedback.textContent = &quot;At least one saved watchlist remains in this preview.&quot;;
        return;
      }
      const deletedName = watchlists[selectedWatchlist].name;
      delete watchlists[selectedWatchlist];
      selectedWatchlist = Object.keys(watchlists)[0];
      renderWatchlist(deletedName + &quot; was removed.&quot;);
    });
    addInstrument.addEventListener(&quot;click&quot;, () =&gt; {
      const list = watchlists[selectedWatchlist];
      const candidate = watchCandidates.find((item) =&gt; !list.instruments.some((instrument) =&gt; instrument.symbol === item.symbol));
      if (!candidate) {
        watchFeedback.textContent = &quot;All available preview instruments are already in this list.&quot;;
        return;
      }
      list.instruments.push(candidate);
      renderWatchlist(candidate.symbol + &quot; added to &quot; + list.name + &quot;.&quot;);
    });
    watchRows.addEventListener(&quot;click&quot;, (event) =&gt; {
      const button = event.target.closest(&quot;[data-watchlist-remove]&quot;);
      if (!button) {
        return;
      }
      const list = watchlists[selectedWatchlist];
      const removed = list.instruments.splice(Number(button.dataset.watchlistRemove), 1)[0];
      renderWatchlist(removed.symbol + &quot; removed from &quot; + list.name + &quot;.&quot;);
    });
    holdingsAccount.addEventListener(&quot;change&quot;, filterHoldings);
    accountSwitcher.addEventListener(&quot;change&quot;, updateAccountSelection);
    holdingsDownload.addEventListener(&quot;click&quot;, () =&gt; {
      holdingsFeedback.textContent = &quot;Holdings register prepared for the selected account view in this UI preview.&quot;;
      status.textContent = &quot;Holdings register prepared.&quot;;
    });
    root.querySelectorAll(&quot;[data-report-download]&quot;).forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        reportStatus.textContent = button.dataset.reportDownload + &quot; prepared for download in this UI preview.&quot;;
        status.textContent = button.dataset.reportDownload + &quot; prepared.&quot;;
      });
    });
    renderWatchlist(&quot;Showing Core allocation.&quot;);
    updateAccountSelection();
    renderStockChart(selectedStockTimeframe);
    syncStockOrderFields();
    stockReview.textContent = &quot;Preview stock order&quot;;
    renderPendingOrder();
    selectView(&quot;international&quot;);
    selectPrimary(selectedPrimaryView);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
